<ion-header class="ion-no-border">
  <div class="nav-container">
    <div class="logo-wrapper">
      <ion-icon name="swords" class="logo-icon"></ion-icon>
      <span class="logo-text">Mission Board</span>
    </div>
    <div class="nav-links">
      <ion-button fill="clear" color="light" class="hide-sm">Misiones</ion-button>
      <ion-button fill="clear" color="light" class="hide-sm">Ranking</ion-button>
      <ion-button fill="solid" class="btn-login">Entrar</ion-button>
    </div>
  </div>
</ion-header>

<ion-content>
  <div class="main-wrapper">
    <div class="register-card">
      <div class="header-section">
        <div class="icon-circle">
          <ion-icon name="person-add"></ion-icon>
        </div>
        <h1>Únete al Gremio</h1>
        <p>Crea tu cuenta para empezar a rastrear misiones y ganar recompensas legendarias.</p>
      </div>

      <form (submit)="onRegister()">
        <div class="input-stack">
          <label>Nombre de Aventurero</label>
          <div class="input-container">
            <ion-icon name="person"></ion-icon>
            <ion-input type="text" placeholder="Ej: DragonSlayer99" name="username"
              [(ngModel)]="ninjaData.username"></ion-input>
          </div>
        </div>

        <div class="input-stack">
          <label>Contraseña</label>
          <div class="input-container">
            <ion-icon name="lock"></ion-icon>
            <ion-input type="password" placeholder="••••••••" name="password"
              [(ngModel)]="ninjaData.password"></ion-input>
          </div>
        </div>

        <div class="input-stack">
          <label>Afiliación (Gremio/Reino)</label>
          <div class="input-container">
            <ion-icon name="shield"></ion-icon>
            <ion-select interface="popover" name="afiliacion" [(ngModel)]="ninjaData.afiliacion" [disabled]="true">
              <ion-select-option value="genin">Academy</ion-select-option>
            </ion-select>
          </div>
        </div>

        <ion-button expand="block" type="submit" class="btn-submit">
          Registrarse como Aventurero
        </ion-button>
      </form>

      <div *ngIf="error" class="error">
        <ion-icon name="alert-circle-outline"></ion-icon> {{ error }}
      </div>

      <div class="footer-link">
        <p>¿Ya tienes una cuenta? <a href="/login">Inicia sesión aquí</a></p>
      </div>
    </div>
  </div>

  <div class="decorative-line"></div>
</ion-content>
