<div class="pet">
    <h3>Successfully registered pet</h3>
    <div class="attribute">Name: {{pet.petName}}</div>  
    <div class="attribute">Type: {{pet.petType}}</div>
    <div class="attribute">Age: {{pet.petAge}}</div>
    <div class="attribute">Microchip: @if(pet.petMicrochip) {Sí}
        @else {No}
    </div>        
</div>
